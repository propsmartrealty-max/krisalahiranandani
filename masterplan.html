            <img fetchpriority="high" src="public/everlyn/masterplan/master_layout_hq.webp" alt="Krisala Hiranandani 105-Acre Masterplan Layout Map" class="map-img" draggable="false" width="3000" height="1875">

                The Della Collection (Villa Plots)

            <div class="hotspot" style="top: 55%; left: 45%;" onclick="window.location.href='/#equestrian'" role="button" aria-label="Explore 8-Acre Private Racecourse & Polo Club">

    <div class="controls" aria-label="Map Zoom and View Controls">
        <button class="control-btn" id="toggleLayoutBtn" title="Switch Layout Plan" aria-label="Toggle Layout View"><i class="ph ph-swap"></i></button>
        <button class="control-btn" onclick="zoom(0.1)" aria-label="Zoom in on masterplan"><i class="ph ph-plus"></i></button>
        <button class="control-btn" onclick="zoom(-0.1)" aria-label="Zoom out on masterplan"><i class="ph ph-minus"></i></button>
        <button class="control-btn" onclick="resetZoom()" aria-label="Reset masterplan zoom to default"><i class="ph ph-arrows-out"></i></button>
    </div>

    <script>
        const wrapper = document.getElementById('mapWrapper');
        const container = document.getElementById('mapContainer');
        const mapImg = document.querySelector('.map-img');
        const toggleBtn = document.getElementById('toggleLayoutBtn');
        let currentMap = 0;
        const layoutMaps = [
            'public/imported/Krisala-x-Hiranandani-Township-Brochure-1.webp',
            'public/everlyn/masterplan/master_layout_hq.webp'
        ];

        if (toggleBtn && mapImg) {
            toggleBtn.addEventListener('click', () => {
                currentMap = (currentMap + 1) % layoutMaps.length;
                mapImg.src = layoutMaps[currentMap];
                resetZoom();
            });
        }

        let scale = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        function updateTransform() {
            wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function zoom(delta) {
            scale = Math.min(Math.max(0.5, scale + delta), 3);
            updateTransform();
        }

        function resetZoom() {
            scale = 1; translateX = 0; translateY = 0;
            updateTransform();
        }

        // Panning Logic
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        // Touch Support for Mobile Drag
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            updateTransform();
        }, { passive: true });

        // Scroll Zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.05 : 0.05;
            zoom(delta);
        }, { passive: false });
    </script>
