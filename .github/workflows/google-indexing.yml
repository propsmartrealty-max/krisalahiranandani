name: Enterprise Google Indexing & Discovery Engine

on:
  push:
    branches: [ main ]
  schedule:
    # Run every 6 hours to inspect GSC health, sync sitemaps, and index changed/unindexed pages
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Indexing Engine Execution Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - audit
          - inspect
          - sitemaps
          - broadcast
          - index

permissions:
  contents: read

jobs:
  google-indexing-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-api-python-client beautifulsoup4

      - name: Verify Canonical Sitemaps & AMP Stories
        run: |
          python scripts/generate_programmatic_sitemaps.py
          npm install -g amphtml-validator || true
          python scripts/validate_amp_guards.py

      - name: Execute Enterprise Google Indexing Orchestrator
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GOOGLE_SA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY || secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          MODE="${{ github.event.inputs.run_mode || 'full' }}"
          echo "Running Enterprise Google Indexing Suite in mode: $MODE"
          python scripts/enterprise_google_indexing_suite.py --mode "$MODE" --live-preflight

      - name: Execute IndexNow Multi-Engine Sync
        run: |
          python scripts/indexnow_notify.py

      - name: Pre-Warm Cloudflare Edge Nodes for Googlebot & AI Crawlers
        run: |
          URLS=(
            "https://krisalahiranandanitownships.com/"
            "https://krisalahiranandanitownships.com/hiranandani-pune"
            "https://krisalahiranandanitownships.com/della-racecourse"
            "https://krisalahiranandanitownships.com/della"
            "https://krisalahiranandanitownships.com/hiranandani-price-list-2026"
            "https://krisalahiranandanitownships.com/pricing"
            "https://krisalahiranandanitownships.com/floor-plans"
            "https://krisalahiranandanitownships.com/masterplan"
            "https://krisalahiranandanitownships.com/colosseum"
            "https://krisalahiranandanitownships.com/arcadia"
            "https://krisalahiranandanitownships.com/icon"
            "https://krisalahiranandanitownships.com/explore/hiranandani-marunji"
            "https://krisalahiranandanitownships.com/llms.txt"
            "https://krisalahiranandanitownships.com/ai-facts.json"
          )
          for u in "${URLS[@]}"; do
            curl -s -o /dev/null -w "%{http_code} %{time_total}s: $u\n" -H "User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$u" || true
          done
