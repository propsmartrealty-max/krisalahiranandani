name: Automated SEO & Edge Deployment Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Daily 03:00 UTC (08:30 IST) automated Google Search Console audit & edge sync
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth beautifulsoup4

      - name: Rebuild Clean Canonical XML Sitemaps & Index
        run: |
          python scripts/generate_programmatic_sitemaps.py

      - name: Validate XML, JSON Manifests & Schema Integrity
        run: |
          python -c "
          import glob, json, re, xml.etree.ElementTree as ET

          for xml_file in glob.glob('*.xml'):
              ET.parse(xml_file)
              print(f'✓ Validated {xml_file}')

          for mf in ['ai-facts.json', 'citations.jsonld', 'geo-township.geojson', 'feed.json']:
              with open(mf, 'r', encoding='utf-8') as fp:
                  json.load(fp)
              print(f'✓ Validated {mf}')

          for f in glob.glob('*.html') + ['thank-you/index.html']:
              with open(f, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              scripts = re.findall(r'<script type=[\"\x27]application/ld\+json[\"\x27]>([\s\S]*?)</script>', content)
              for s in scripts:
                  json.loads(s.strip())
          print('✓ All Schemas, XML and AI manifests valid')
          "

      - name: Notify IndexNow API & WebSub
        run: |
          python scripts/indexnow_notify.py
          python scripts/enterprise_google_indexing_suite.py --mode broadcast

      - name: Track Google Keyword Rankings & Generate Telemetry
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > scripts/google_service_account.json
            python scripts/keyword_rank_tracker.py || true
            python scripts/enterprise_google_indexing_suite.py --mode index --live-preflight || true
            rm -f scripts/google_service_account.json
          else
            echo "GOOGLE_SERVICE_ACCOUNT_KEY secret not configured. Skipping GSC/Indexing API steps."
          fi

      - name: Optimize Cloudflare Edge & Purge Cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY || secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            python scripts/cloudflare_optimizer.py --token "$CF_TOKEN" || true
          elif [ -n "$CF_GLOBAL_KEY" ] && [ -n "$CF_EMAIL" ]; then
            python scripts/cloudflare_optimizer.py --key "$CF_GLOBAL_KEY" --email "$CF_EMAIL" || true
          fi
