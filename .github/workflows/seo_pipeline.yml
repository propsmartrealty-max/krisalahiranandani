name: Automated SEO & Edge Deployment Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 03:00 UTC (08:30 IST) for automated Google & search engine sweep
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth

      - name: Regenerate 10,000 Programmatic Sitemaps & Master Index
        run: |
          python scripts/generate_programmatic_sitemaps.py


      - name: Validate HTML, XML & Schema Integrity
        run: |
          python -c "
          import glob, json, re, xml.etree.ElementTree as ET

          for xml_file in glob.glob('*.xml'):
              ET.parse(xml_file)
              print(f'✓ Validated {xml_file}')

          for f in glob.glob('*.html') + ['thank-you/index.html']:
              with open(f, 'r', encoding='utf-8') as fp:
                  content = fp.read()
              scripts = re.findall(r'<script type=[\"\x27]application/ld\+json[\"\x27]>([\s\S]*?)</script>', content)
              for i, s in enumerate(scripts):
                  json.loads(s.strip())
          print('✓ All Schemas and XML valid')
          "

      - name: Notify IndexNow API (Bing, Yandex, Seznam, Naver)
        run: |
          python scripts/indexnow_notify.py

      - name: Ping Search Engine Sitemaps
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://krisalahiranandanitownships.com/sitemap-index.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://krisalahiranandanitownships.com/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://krisalahiranandanitownships.com/video-sitemap.xml" || true
          echo "Search engine sitemap ping completed."

      - name: Run Google Indexing API (If Service Account Key is Present)
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_SA_KEY" ]; then
            echo "$GOOGLE_SA_KEY" > scripts/google_service_account.json
            python scripts/google_indexing.py || true
          else
            echo "GOOGLE_SERVICE_ACCOUNT_KEY secret not configured. Skipping automated Google Indexing API push."
          fi

      - name: Purge Cloudflare Edge Cache (If Token is Present)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            python scripts/cloudflare_optimizer.py --token "$CF_TOKEN" || true
          else
            echo "CLOUDFLARE_API_TOKEN secret not configured. Skipping automated edge cache purge."
          fi
