<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <title>Page Not Found | Krisala Hiranandani Township</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--bg-dark);
        }

        .error-content {
            max-width: 600px;
            padding: 40px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 10rem;
            line-height: 1;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .error-content h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .error-content p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .error-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-links a {
            padding: 14px 30px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 8px;
            color: var(--gold-primary);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .error-links a:hover {
            background: rgba(197, 160, 89, 0.1);
            transform: translateY(-2px);
        }

        .error-links a.primary-link {
            background: var(--gold-primary);
            color: var(--bg-dark);
            border-color: var(--gold-primary);
        }

        .error-links a.primary-link:hover {
            background: var(--gold-light);
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1>This wing is still under <span>construction</span></h1>
            <p>The page you're looking for doesn't exist yet. But our 105-acre township certainly does.</p>
            <div class="error-links">
                <a href="/" class="primary-link">Return to Township</a>
                <a href="/everlyn">Explore Everlyn</a>
                <a href="/della">Discover Della</a>
                <a href="/compare">Compare Projects</a>
                <a href="/blog">Research Blog</a>
            </div>
        </div>
    </div>
</body>

</html>
